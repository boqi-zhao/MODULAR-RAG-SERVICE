[project]
name = "modular-rag-service"
version = "0.1.0"
description = "Modular RAG service with reproducible stage artifacts and evaluation workflows"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "concurrent-log-handler>=0.9.29",
    "fastapi>=0.142.2",
    "psycopg[binary]>=3.3.6",
    "sqlalchemy>=2.1.3",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
