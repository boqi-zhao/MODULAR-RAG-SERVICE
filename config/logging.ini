# Loaded by common.logger for the application and command-line tools.
[loggers]
keys=root,uvicorn,uvicorn_error,uvicorn_access

[handlers]
keys=console,file

[formatters]
keys=standard

# Application loggers inherit the root handler and level.
[logger_root]
level=INFO
handlers=console,file

[logger_uvicorn]
level=INFO
handlers=
qualname=uvicorn
propagate=1

# Forward server and access logs to the root handlers.
[logger_uvicorn_error]
level=INFO
handlers=
qualname=uvicorn.error
propagate=1

[logger_uvicorn_access]
level=INFO
handlers=
qualname=uvicorn.access
propagate=1

# Console output can be collected by the process supervisor.
[handler_console]
class=StreamHandler
level=NOTSET
formatter=standard
args=(sys.stderr,)

# Active file: 10 MiB; keep ten numbered backups.
[handler_file]
class=concurrent_log_handler.ConcurrentRotatingFileHandler
level=NOTSET
formatter=standard
args=(%(log_file)s, 'a', 10485760, 10, 'utf-8')

[formatter_standard]
format=%(asctime)s %(levelname)s [%(threadName)s:%(thread)d] [%(module)s:%(lineno)d] %(message)s
datefmt=%Y-%m-%d %H:%M:%S
